<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symptom Sorter has moved</title>
<meta http-equiv="refresh" content="2; url=wfa/">
<link rel="canonical" href="wfa/">
<style>
  :root{--bg:#eef0ec;--ink:#1d2622;--accent:#24453b;--muted:#5b6660}
  @media (prefers-color-scheme:dark){:root{--bg:#141a17;--ink:#e6ebe8;--accent:#8fc3ad;--muted:#9aa7a0}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
       font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px;box-sizing:border-box}
  main{max-width:30rem;text-align:center}
  h1{font-size:1.3rem;margin:0 0 .5rem}
  p{margin:.4rem 0;color:var(--muted)}
  a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<main>
  <h1>The Symptom Sorter has moved</h1>
  <p>The FM-51-only version is no longer maintained. Use the WFA version, which is kept up to date.</p>
  <p><a href="wfa/">Open the Symptom Sorter (WFA) →</a></p>
</main>
<script>
// Send people straight on, and remove the old FM-51 app's offline helper from this device if it is still installed.
// The WFA app at /wfa/ has its own helper and saved copies, which are not touched.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => {
    if (new URL(r.scope).pathname === new URL('./', location.href).pathname) r.unregister();
  })).catch(() => {});
}
if ('caches' in self) caches.keys().then(ks => Promise.all(ks.filter(k => k.startsWith('ss-fm51-')).map(k => caches.delete(k)))).catch(() => {});
try { localStorage.removeItem('ss-fm51-sel'); localStorage.removeItem('ss-fm51-hide'); } catch (e) {}
setTimeout(() => location.replace('wfa/'), 300);   // a moment for the cleanup above
</script>
</body>
</html>
